[package]
name = "oodssistant"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bon = "3.9.1"
bon_macro = { version = "0.1.0", path = "../restman-rs/bon_macro" }
chrono = { version = "0.4.44", features = ["serde"] }
oauth2 = "5.0.0"
reqwest = "0.13.4"
restman-rs = { version = "0.1.0", path = "../restman-rs", features = ["reqwest"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = { version = "3.20.0", features = ["macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
warp = { version = "0.4.3", features = ["server"] }
uuid = { version = "1.4", features = ["v4"] }
async-trait = "0.1.89"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
anyhow = "1.0.104"
bytes = "1.12.1"
mime = "0.3.17"
futures-util = "0.3.33"
derive_more = { version = "2.1.1", features = ["display"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
debug = false
opt-level = 3
